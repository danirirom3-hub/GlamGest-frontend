<div class="container">
  <h2>{{ isEditing ? 'Editar empleado' : 'Gestión de Empleados' }}</h2>

  <!-- FILTRO (solo visual) -->
  <div class="filter-bar">
    <input 
      type="checkbox" 
      [(ngModel)]="showOnlyActive"
      name="filterActive"
    >
    <span>Mostrar solo empleados activos</span>
  </div>

  <!-- FORMULARIO -->
  <form (ngSubmit)="onSubmit()" #employeeForm="ngForm" class="form">

    <div class="form-group">
      <label for="name">Nombre</label>
      <input 
        type="text" 
        id="name" 
        name="name"
        [(ngModel)]="employee.name" 
        required 
        class="form-control"
        placeholder="Ingrese el nombre">
    </div>

    <div class="form-group">
      <label for="phone">Teléfono</label>
      <input 
        type="text" 
        id="phone" 
        name="phone"
        [(ngModel)]="employee.phone" 
        required 
        class="form-control"
        placeholder="Ingrese el teléfono">
    </div>

    <div class="form-group">
      <label for="active">Estado</label>
      <select 
        id="active" 
        name="active"
        [(ngModel)]="employee.active" 
        class="form-control">

        <option [ngValue]="true">Activo</option>
        <option [ngValue]="false">Inactivo</option>

      </select>
    </div>

    <div class="form-group">
      <button type="submit" class="btn btn-primary" [disabled]="employeeForm.invalid">
        {{ isEditing ? 'Actualizar empleado' : 'Guardar empleado' }}
      </button>

      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancelar
      </button>
    </div>

    <div class="alerta" *ngIf="mensaje">
      {{ mensaje }}
    </div>

  </form>

  <hr>

  <h3>Lista de Empleados</h3>

  <!-- ESTADO VACÍO -->
  <div class="empty" *ngIf="!visibleEmployees || visibleEmployees.length === 0">
    No hay empleados disponibles
  </div>

  <!-- TABLA -->
  <table class="table" *ngIf="visibleEmployees && visibleEmployees.length > 0">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let emp of visibleEmployees">
        <td>{{ emp.name }}</td>
        <td>{{ emp.phone }}</td>
        <td>
          <span [ngClass]="emp.active ? 'text-success' : 'text-danger'">
            {{ emp.active ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td>
          <button class="btn btn-warning btn-sm" (click)="onEdit(emp)">
            Editar
          </button>

          <button class="btn btn-danger btn-sm" (click)="onDelete(emp.id)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
