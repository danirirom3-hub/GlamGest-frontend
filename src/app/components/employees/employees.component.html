<div class="container">
  <h2>{{ isEditing ? 'Editar empleado' : 'Gestión de Empleados' }}</h2>

  <!-- FILTRO (Se mantiene según lo solicitado) -->
  <div class="filter-bar">
    <input 
      type="checkbox" 
      [(ngModel)]="showOnlyActive"
      name="filterActive"
    >
    <span>Mostrar solo empleados activos</span>
  </div>

  <!-- FORMULARIO -->
  <form (ngSubmit)="onSubmit()" #employeeForm="ngForm" class="form">

    <div class="form-group">
      <label for="name">Nombre</label>
      <input 
        type="text" 
        id="name" 
        name="name"
        [(ngModel)]="employee.name" 
        required 
        class="form-control"
        placeholder="Ingrese el nombre">
    </div>

    <div class="form-group">
      <label for="phone">Teléfono</label>
      <input 
        type="text" 
        id="phone" 
        name="phone"
        [(ngModel)]="employee.phone" 
        required 
        class="form-control"
        placeholder="Ingrese el teléfono">
    </div>

    <div class="form-group">
      <button type="submit" class="btn btn-primary" [disabled]="employeeForm.invalid">
        {{ isEditing ? 'Actualizar empleado' : 'Guardar empleado' }}
      </button>

      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancelar
      </button>
    </div>

    <div class="alerta" *ngIf="mensaje">
      {{ mensaje }}
    </div>

  </form>

  <hr>

  <h3>Lista de Empleados</h3>

  <!-- ESTADO VACÍO -->
  <div class="empty" *ngIf="!visibleEmployees || visibleEmployees.length === 0">
    No hay empleados disponibles
  </div>

  <!-- TABLA -->
  <table class="table" *ngIf="visibleEmployees && visibleEmployees.length > 0">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let emp of visibleEmployees">
        <td>{{ emp.name }}</td>
        <td>{{ emp.phone }}</td>

        <td class="acciones">

          <!-- EDITAR -->
          <button class="btn-icon editar" (click)="onEdit(emp)">
            <i class="fa-solid fa-pen"></i>
          </button>

          <!-- ACTIVO / INACTIVO -->
          <button class="btn-icon estado" (click)="toggleActive(emp)">
            <i class="fa-solid"
               [class.fa-toggle-on]="emp.active"
               [class.fa-toggle-off]="!emp.active"></i>
          </button>

          <!-- ELIMINAR -->
          <button class="btn-icon eliminar" (click)="onDelete(emp.id)">
            <i class="fa-solid fa-trash"></i>
          </button>

        </td>
      </tr>
    </tbody>
  </table>
</div>
