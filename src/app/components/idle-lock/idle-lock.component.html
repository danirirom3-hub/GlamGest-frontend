<div *ngIf="visible" class="lock-backdrop" role="presentation">
  <section class="lock-dialog" role="dialog" aria-modal="true"
    aria-labelledby="idle-lock-title" aria-describedby="idle-lock-description">
    <div class="lock-brand" aria-hidden="true">G</div>
    <span class="lock-eyebrow">GLAM<span>GEST</span></span>
    <h2 id="idle-lock-title">{{ 'idleLock.title' | translate }}</h2>
    <p id="idle-lock-description">{{ 'idleLock.description' | translate }}</p>

    <form (ngSubmit)="unlock()">
      <label for="idle-lock-password">{{ 'idleLock.password' | translate }}</label>
      <div class="password-field">
        <input #passwordInput id="idle-lock-password" [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password" name="password" autocomplete="current-password" />
        <button type="button" class="toggle-password" (click)="showPassword = !showPassword"
          [attr.aria-label]="(showPassword ? 'idleLock.hideAria' : 'idleLock.showAria') | translate">
          {{ (showPassword ? 'idleLock.hide' : 'idleLock.show') | translate }}
        </button>
      </div>
      <p *ngIf="message" class="lock-message" [class.error]="messageType === 'error'" role="alert">{{ message }}</p>
      <button type="submit" class="unlock-button">{{ 'idleLock.continue' | translate }}</button>
    </form>
    <p class="lock-footer">{{ 'idleLock.footer' | translate }}</p>
  </section>
</div>
