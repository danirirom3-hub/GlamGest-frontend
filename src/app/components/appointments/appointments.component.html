<div class="page">

  <div class="container">

    <div class="header">
      <h2>Citas</h2>
      <p>Gestiona la agenda del salón</p>
    </div>

    <div class="tabs">
      <button [class.active]="view === 'create'" (click)="view = 'create'">Nueva Cita</button>
      <button [class.active]="view === 'list'" (click)="view = 'list'">Agenda</button>
      <button [class.active]="view === 'calendar'" (click)="view = 'calendar'">Calendario</button>
    </div>

    <div *ngIf="view === 'create'" class="card">

      <div class="grid">
        <select [(ngModel)]="selectedClient">
          <option [ngValue]="null">Cliente</option>
          <option *ngFor="let c of clients" [ngValue]="c.name">
            {{ c.name }}
          </option>
        </select>

        <select [(ngModel)]="selectedEmployee">
          <option [ngValue]="null">Empleado</option>
          <option *ngFor="let e of employees" [ngValue]="e">
            {{ e.name }}
          </option>
        </select>

        <input type="date" [(ngModel)]="selectedDate">
        <input type="time" [(ngModel)]="selectedTime">
      </div>

      <div class="details-field">
        <textarea 
          [(ngModel)]="details"
          placeholder="Agregar detalles de la cita (opcional)...">
        </textarea>
      </div>

      <div class="servicios-grid">
        <div class="servicio-item"
             *ngFor="let s of services"
             [class.activo]="selectedService === s"
             (click)="selectService(s)">
          {{ s.name }}
        </div>

        <div class="empty" *ngIf="!services || services.length === 0">
          No hay servicios disponibles
        </div>
      </div>

      <div class="empty" *ngIf="!employees || employees.length === 0">
        No hay empleados disponibles
      </div>

      <button class="btn-primary" (click)="scheduleAppointment()" [disabled]="isLoading">
        <span *ngIf="!isLoading">Agendar cita</span>
        <span *ngIf="isLoading">Cargando...</span>
      </button>

      <div class="alerta" *ngIf="showConfirmation">
        Cita registrada correctamente
      </div>

    </div>

    <div *ngIf="view === 'list'" class="card">

      <div class="grid">
        <input placeholder="Cliente" [(ngModel)]="filterClient">
        <input placeholder="Empleado" [(ngModel)]="filterEmployee">
        <input type="date" [(ngModel)]="filterDate">
      </div>

      <div class="empty" *ngIf="filteredAppointments().length === 0">
        No hay citas registradas
      </div>

      <div *ngFor="let c of filteredAppointments()" class="cita-card">

        <div class="info">
          <h4>{{ c.client }}</h4>
          <p>{{ c.service }} • {{ c.time }}</p>

          <p class="details-text" *ngIf="c.details">
            {{ c.details }}
          </p>

          <small>{{ c.employee }} | {{ c.status }}</small>
        </div>

        <button class="btn-primary small"
                [disabled]="c.status === 'sent_to_cash'"
                (click)="sendToCash(c)">
          {{ c.status === 'sent_to_cash' ? 'En caja' : 'Pasar a caja' }}
        </button>

        <button class="btn-danger small" (click)="deleteAppointment(c)">Eliminar</button>

      </div>

    </div>

    <div *ngIf="view === 'calendar'" class="calendar-wrapper">
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>

  </div>
</div>
