<div class="page">

  <div class="login-container">

    <!-- Botón volver -->
    <div class="top-bar">
      <button routerLink="/home" class="btn-back">
        <lucide-icon [img]="icons.arrowLeft"></lucide-icon>
        <span>Volver</span>
      </button>
    </div>

    <!-- Título -->
    <h2 class="titulo">Glam<span>Gest</span></h2>
    <p class="subtitulo">Inicia sesión</p>

    <form (ngSubmit)="onLogin()">
      
      <div class="input-group">
        <label>Correo electrónico</label>
        <input 
          type="email" 
          [(ngModel)]="user.email" 
          name="email" 
          placeholder="Tu correo electrónico">
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input 
          type="password" 
          [(ngModel)]="user.password" 
          name="password" 
          placeholder="Contraseña">
      </div>

      <input
        type="text"
        name="website"
        autocomplete="off"
        tabindex="-1"
        aria-hidden="true"
        class="honeypot-field">

      <re-captcha
        [siteKey]="recaptchaSiteKey"
        (resolved)="onRecaptchaResolved($event)">
      </re-captcha>

      <button type="submit">Ingresar</button>
    </form>

    <p class="privacy-login-note">
      Si tu política de tratamiento de datos requiere actualización, te la mostraremos después de iniciar sesión.
    </p>

    <!-- Mensaje dinámico -->
    <div *ngIf="message" 
         [ngClass]="{'mensaje-success': messageType === 'success', 'mensaje-error': messageType === 'error'}" 
         class="mensaje-base">
      {{ message }}
    </div>

  </div>

</div>
