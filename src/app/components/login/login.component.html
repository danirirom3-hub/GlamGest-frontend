<div class="page">

  <div class="login-container">

    <!-- Botón volver -->
    <div class="top-bar">
      <button routerLink="/home" class="btn-back">
        <lucide-icon [img]="icons.arrowLeft"></lucide-icon>
        <span>{{ 'common.back' | translate }}</span>
      </button>
    </div>

    <!-- Título -->
    <h2 class="titulo">Glam<span>Gest</span></h2>
    <p class="subtitulo">{{ 'auth.login' | translate }}</p>

    <form (ngSubmit)="onLogin()">
      
      <div class="input-group">
         <label>{{ 'auth.email' | translate }}</label>
        <input 
          type="email" 
          [(ngModel)]="user.email" 
          name="email" 
           [placeholder]="'auth.email' | translate">
      </div>

      <div class="input-group">
         <label>{{ 'auth.password' | translate }}</label>
        <input 
          type="password" 
          [(ngModel)]="user.password" 
          name="password" 
           [placeholder]="'auth.password' | translate">
      </div>

      <input
        type="text"
        name="website"
        autocomplete="off"
        tabindex="-1"
        aria-hidden="true"
        class="honeypot-field">

      <re-captcha
        [siteKey]="recaptchaSiteKey"
        (resolved)="onRecaptchaResolved($event)">
      </re-captcha>

       <button type="submit">{{ 'auth.loginButton' | translate }}</button>
    </form>

    <p class="privacy-login-note">
      {{ 'auth.privacyNote' | translate }}
    </p>

    <!-- Mensaje dinámico -->
    <div *ngIf="message" 
         [ngClass]="{'mensaje-success': messageType === 'success', 'mensaje-error': messageType === 'error'}" 
         class="mensaje-base">
      {{ message }}
    </div>

  </div>

</div>
