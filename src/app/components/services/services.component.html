<div class="page">
  <div class="container">

    <!-- FORMULARIO -->
    <div class="form-card">
      <div class="form-header">
        <h2>{{ isEditing ? 'Editar servicio' : 'Nuevo servicio' }}</h2>
        <span class="sub">Completa la información del servicio</span>
      </div>

      <form (ngSubmit)="saveService()" class="form-grid">

        <div class="input-group">
          <label>Nombre del servicio</label>
          <input
            type="text"
            placeholder="Ej: Corte de cabello"
            name="name"
            [(ngModel)]="service.name"
          >
        </div>

        <div class="input-group">
          <label>Precio</label>
          <input
            type="number"
            placeholder="Ej: 20000"
            name="price"
            [(ngModel)]="service.price"
          >
        </div>

        <div class="input-group">
          <label>Duración (minutos)</label>
          <input
            type="number"
            placeholder="Ej: 30"
            name="durationMinutes"
            [(ngModel)]="service.durationMinutes"
          >
        </div>

        <div class="input-group full">
          <label>Descripción</label>
          <textarea
            name="description"
            placeholder="Describe el servicio..."
            [(ngModel)]="service.description"
          ></textarea>
        </div>

        <div class="form-actions">
          <button class="btn-save" type="submit">
            {{ isEditing ? 'Actualizar servicio' : 'Guardar servicio' }}
          </button>

          <button
            class="btn-cancel"
            type="button"
            *ngIf="isEditing"
            (click)="cancelEdit()"
          >
            Cancelar
          </button>
        </div>

      </form>

      <p class="mensaje">{{ message }}</p>
    </div>

    <!-- FILTRO -->
    <div class="form-card filtro" (click)="toggleFiltro()">
      <input 
        type="checkbox" 
        [checked]="showOnlyActive"
        (click)="$event.stopPropagation()"
        (change)="toggleFiltro()"
      >
      <span>Mostrar solo servicios activos</span>
    </div>

    <!-- LISTADO -->
    <div class="cards">

      <div class="card" 
           *ngFor="let item of filteredServices"
           [class.inactivo]="!item.active">

        <div class="card-header">
          <h3>{{ item.name }}</h3>
          <span class="precio">${{ item.price }}</span>
        </div>

        <div class="card-body">
          <p class="duracion">Duración: {{ item.durationMinutes }} minutos</p>
          <p class="descripcion">{{ item.description }}</p>
        </div>

        <div class="acciones">

          <button class="btn-icon editar" (click)="editService(item)">
            <i class="fa-solid fa-pen"></i>
          </button>

          <button class="btn-icon estado" (click)="toggleActive(item)">
            <i class="fa-solid"
               [class.fa-toggle-on]="item.active"
               [class.fa-toggle-off]="!item.active"></i>
          </button>

        </div>

      </div>

      <div *ngIf="filteredServices.length === 0" class="empty">
        No hay servicios registrados.
      </div>

    </div>

  </div>
</div>
