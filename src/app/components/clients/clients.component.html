<div class="contenedor-clientes">

  <!-- HEADER -->
  <div class="header-clientes">

    <input 
      type="text" 
      [(ngModel)]="searchText" 
      placeholder="Buscar por nombre, correo o teléfono..."
    >

    <button class="btn-nuevo" (click)="onNew()">
      Nuevo Cliente
    </button>

  </div>

  <!-- FORMULARIO -->
  <div class="form-card">

    <h2>{{ isEditing ? 'Editar cliente' : 'Nuevo cliente' }}</h2>

    <div class="form-grid">

      <div class="input-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="client.name" placeholder="Nombre">
      </div>

      <div class="input-group">
        <label>Apellido</label>
        <input type="text" [(ngModel)]="client.lastName" placeholder="Apellido">
      </div>

      <div class="input-group">
        <label>Correo</label>
        <input type="email" [(ngModel)]="client.email" placeholder="Correo">
      </div>

      <div class="input-group">
        <label>Teléfono</label>
        <input type="text" [(ngModel)]="client.phone" placeholder="Teléfono">
      </div>

    </div>

    <button class="btn-save" (click)="onSubmit()">
      {{ isEditing ? 'Actualizar cliente' : 'Guardar cliente' }}
    </button>

    <div class="alerta" *ngIf="showConfirmation">
      Acción realizada correctamente
    </div>

  </div>

  <!-- LISTA -->
  <div class="cards" *ngIf="clients && clients.length > 0; else vacio">

    <div class="card" *ngFor="let c of clients">

      <div class="card-header">
        <h3>{{ c.name }} {{ c.lastName }}</h3>
        <span class="correo">{{ c.email }}</span>
      </div>

      <div class="card-body">
        <p><strong>Tel:</strong> {{ c.phone }}</p>
      </div>

      <div class="acciones">
        <button class="btn-icon editar" (click)="onEdit(c)">
          <i class="fas fa-pencil-alt"></i>
        </button>

        <button class="btn-icon eliminar" (click)="onDelete(c)">
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>

    </div>

  </div>

  <!-- VACÍO -->
  <ng-template #vacio>
    <div class="empty-state">
      <h3>No hay clientes registrados</h3>
      <p>Agrega tu primer cliente para empezar a gestionar.</p>
    </div>
  </ng-template>

</div>
