<div class="page">

  <div class="container">

    <div class="top-bar">
      <button routerLink="/home" class="btn-back">
        <lucide-icon [img]="icons.arrowLeft"></lucide-icon>
        <span>{{ 'users.back' | translate }}</span>
      </button>
    </div>

    <div class="header">
      <h2>Glam<span>Gest</span></h2>
      <p>{{ 'users.title' | translate }}</p>
    </div>

    <form class="form" (ngSubmit)="registerUser()" autocomplete="off">

      <div class="campo">
        <label for="name">{{ 'users.name' | translate }}</label>
        <input id="name" type="text"
          [(ngModel)]="user.name"
          name="name"
          [placeholder]="'users.namePlaceholder' | translate"
          required>
      </div>

      <div class="campo">
        <label for="email">{{ 'users.email' | translate }}</label>
        <input id="email" type="email"
          [(ngModel)]="user.email"
          name="email"
          [placeholder]="'users.emailPlaceholder' | translate"
          required>
      </div>

      <div class="campo">
        <label for="password">{{ 'users.password' | translate }}</label>
        <input id="password" type="password"
          [(ngModel)]="user.password"
          (ngModelChange)="onPasswordChange($event)"
          name="password"
          [placeholder]="'users.passwordPlaceholder' | translate"
          aria-describedby="password-requirements"
          required>
        <ul id="password-requirements" class="password-requirements" [attr.aria-label]="'users.passwordRequirements' | translate">
          <li *ngFor="let requirement of passwordRequirements" [class.is-valid]="requirement.satisfied">
            <span class="requirement-indicator" aria-hidden="true">{{ requirement.satisfied ? '✓' : '○' }}</span>
            <span>{{ requirement.key | translate }}</span>
          </li>
        </ul>
      </div>

      <div class="campo">
        <label for="phone">{{ 'users.phone' | translate }}</label>
        <input id="phone" type="tel"
          [(ngModel)]="user.phone"
          name="phone"
          [placeholder]="'users.phonePlaceholder' | translate"
          required>
      </div>

      <label class="privacy-option">
        <input type="checkbox"
          [(ngModel)]="user.privacyPolicyAccepted"
          name="privacyPolicyAccepted"
          aria-required="true">
        <span>{{ 'users.privacyAccept' | translate }} <a [routerLink]="['/privacy-policy']" [queryParams]="{ returnUrl: '/users' }">{{ 'users.readPolicy' | translate }}</a></span>
      </label>

      <re-captcha
        [siteKey]="recaptchaSiteKey"
        (resolved)="onRecaptchaResolved($event)">
      </re-captcha>

      <button class="btn" type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ 'users.registerButton' | translate }}</span>
        <span *ngIf="isLoading">{{ 'users.registering' | translate }}</span>
      </button>

    </form>

    <div *ngIf="message" 
         [ngClass]="{'mensaje-success': messageType === 'success', 'mensaje-error': messageType === 'error'}" 
         class="mensaje-base">
      {{ message }}
    </div>

  </div>

</div>
