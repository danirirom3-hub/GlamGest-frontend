<div class="page">

  <div class="container">

    <div class="top-bar">
      <button routerLink="/home" class="btn-back">
        <lucide-icon [img]="icons.arrowLeft"></lucide-icon>
        <span>Volver</span>
      </button>
    </div>

    <div class="header">
      <h2>Glam<span>Gest</span></h2>
      <p>Registro de nuevos usuarios</p>
    </div>

    <form class="form" (ngSubmit)="registerUser()" autocomplete="off">

      <div class="campo">
        <label for="name">Nombre</label>
        <input id="name" type="text"
          [(ngModel)]="user.name"
          name="name"
          placeholder="nombre"
          required>
      </div>

      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email"
          [(ngModel)]="user.email"
          name="email"
          placeholder="correo@ejemplo.com"
          required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password"
          [(ngModel)]="user.password"
          name="password"
          placeholder="digite una contraseña segura"
          required>
      </div>

      <button class="btn" type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Registrar usuario</span>
        <span *ngIf="isLoading">Registrando...</span>
      </button>

    </form>

    <div *ngIf="message" 
         [ngClass]="{'mensaje-success': messageType === 'success', 'mensaje-error': messageType === 'error'}" 
         class="mensaje-base">
      {{ message }}
    </div>

  </div>

</div>
