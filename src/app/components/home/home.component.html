<div class="home">

  <div class="card">

    <div class="brand">
      <h1>Glam<span>Gest</span></h1>
    </div>

    <p class="frase">
      {{ 'home.tagline' | translate }}
    </p>

    <div class="acciones">

      <button routerLink="/login" class="btn primary">
        <lucide-icon [img]="icons.logIn"></lucide-icon>
        <span>{{ 'home.login' | translate }}</span>
      </button>

      <button routerLink="/users" class="btn secondary">
        <lucide-icon [img]="icons.userPlus"></lucide-icon>
        <span>{{ 'home.createAccount' | translate }}</span>
      </button>

    </div>

  </div>

</div>
